<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd9e0; font-family: system-ui, -apple-system, sans-serif; }
  canvas#view { display: block; }
  /* The HUD's zones and their places are in src/ui.css, the map of who goes where is in src/hud.js. */
  .hud { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  /* The map capsule (street, area, danger, the clock, the police line, the round minimap) is styled in src/ui.css; its parts are filled by src/main.js, police.js and daynight.js. */
  #speed { font-size: 30px; font-weight: 800; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #speed small { font-size: 11px; font-weight: 600; margin-left: 3px; }
  #keyhint { padding: 6px 12px; border-radius: 8px; background: rgba(11,7,9,.8); border: 1px solid #e8559a; color: #fff; font: 600 13px system-ui, sans-serif; transition: opacity .6s; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #4a5560; text-shadow: none; transition: opacity .5s; }
  #loading.out { opacity: 0; }
</style>
<link rel="stylesheet" href="src/mobile.css">
<link rel="stylesheet" href="src/ui.css">
</head>
<body>
<canvas id="view"></canvas>
<div class="hud" id="loading">Costruendo Palermo…<div id="tip"></div></div>   <!-- #tip: one tip at a time, src/loading-tips.js -->
<div id="hud">   <!-- one place for each kind of message: src/hud.js -->
  <div class="hz hz-status"></div>
  <div class="hz hz-top"><div class="hz-obj"></div><div class="hz-alert"></div><div class="hz-moment"></div><div class="hz-pick"></div><div class="hz-feed"></div></div>
  <div class="hz hz-map"><div class="hud" id="where"><div id="pd-card">   <!-- the map capsule: the words (street or landmark, area and danger, the police line) on the left, the round minimap at its right end -->
    <div id="pd-info"><div id="pd-loc"><div id="street"></div><div id="landmark"></div></div></div>
    <div id="pd-mapw"><canvas class="hud" id="mini" width="200" height="200"></canvas></div>
  </div></div></div>
  <div class="hz hz-bottom"><div class="hz-act"></div><div class="hz-gauges"><div class="hud" id="speed">0<small>km/h</small></div></div></div>
</div>

<script src="src/loading-tips.js" defer></script>
<script src="palermo-data.js"></script>
<script src="props-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
