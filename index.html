<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palermo Drive">
<link rel="manifest" href="manifest.webmanifest">
<title>Palermo Drive</title>
<meta name="description" content="Palermo Drive: 3 ruote 2 frecce 1 clacson 0 dignità. Guida una lapa nel caos di Palermo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Palermo Drive">
<meta property="og:description" content="3 ruote 2 frecce 1 clacson 0 dignità.">
<meta property="og:image" content="https://ebonura.github.io/palermo-drive/assets/ui/cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Palermo Drive: logo over an aerial view of Palermo at sunset">
<meta property="og:url" content="https://ebonura.github.io/palermo-drive/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ebonura.github.io/palermo-drive/assets/ui/cover.png">
<meta name="theme-color" content="#0b0709">
<link rel="icon" type="image/svg+xml" href="assets/ui/favicon.svg">
<link rel="apple-touch-icon" href="assets/ui/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd9e0; font-family: system-ui, -apple-system, sans-serif; }
  canvas#view { display: block; }
  .hud { position: fixed; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  /* Street name sits under the minimap, centred on it, like a sat-nav. */
  #where { top: 228px; right: 16px; width: 206px; text-align: center; }
  #street { font-size: 17px; font-weight: 800; line-height: 1.15; background: rgba(11,7,9,.72); border: 1px solid rgba(232,85,154,.7);
    border-radius: 8px; padding: 4px 8px; display: inline-block; max-width: 100%; text-shadow: none; }
  #street:empty { display: none; }
  #landmark { font-size: 12px; opacity: .9; margin-top: 3px; }
  #speed { bottom: 16px; left: 16px; font-size: 44px; font-weight: 800; line-height: 1; }
  #speed small { font-size: 14px; font-weight: 600; margin-left: 4px; }
  #mini { top: 16px; right: 16px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  /* Keyboard controls stay hidden until the player presses "?" (a hint says so on the first drive). */
  #help:not(.show) { display: none; }
  #keyhint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px;
    background: rgba(11,7,9,.8); border: 1px solid #e8559a; color: #fff; font: 600 13px system-ui, sans-serif;
    pointer-events: none; transition: opacity .6s; z-index: 30; }
  #help { bottom: 16px; right: 16px; font-size: 12px; line-height: 1.55; background: rgba(0,0,0,.35); padding: 8px 12px; border-radius: 8px; text-shadow: none; }
  #help b { display: inline-block; min-width: 46px; }
  #loading { inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #4a5560; text-shadow: none; transition: opacity .5s; }
  #loading.out { opacity: 0; }
</style>
<link rel="stylesheet" href="src/mobile.css">
<link rel="stylesheet" href="src/ui.css">
</head>
<body>
<canvas id="view"></canvas>
<div class="hud" id="loading">Costruendo Palermo…</div>
<div class="hud" id="where"><div id="street"></div><div id="landmark"></div></div>
<div class="hud" id="speed">0<small>km/h</small></div>
<canvas class="hud" id="mini" width="200" height="200"></canvas>
<div class="hud" id="help">
  <b>WASD</b> drive<br>
  <b>Space</b> handbrake<br>
  <b>Shift</b> nitro<br>
  <b>H</b> horn<br>
  <b>V</b> swap vehicle<br>
  <b>C</b> camera<br>
  <b>R</b> back on the road<br>
  <b>1-7</b> Quattro Canti, Teatro Massimo, Cattedrale, Normanni, Pretoria, La Cala, Stazione<br>
  <b>?</b> show/hide these controls
</div>

<script src="palermo-data.js"></script>
<script src="props-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
