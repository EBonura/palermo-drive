[package]
name = "joinlog"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "MIT"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS roots are compiled in (webpki-roots), so the final image can be empty: no CA bundle, no shell, no libc
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
