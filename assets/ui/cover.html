<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Palermo Drive cover</title>
<!-- Source of assets/ui/cover.png (1200x630) and cover-portrait.png (1080x1920). Rendered by assets/ui/make-cover.sh:
     headless Chrome screenshots of this page at the output size. ?mode=landscape|portrait|logo -->
<link rel="stylesheet" href="../../src/ui.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0709; font-family: var(--pd-cond); }
  #c { position: absolute; inset: 0; overflow: hidden; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  /* dusk grade: the pale render sky becomes violet, pink and orange; the city keeps its own colours */
  .landscape { --h: 30%; } .portrait { --h: 24%; }  /* how far down the dusk grade reaches: the street shots have no horizon, only the facades behind the logo get it */
  .dusk { background: linear-gradient(180deg, #0b0709 0%, #2a0f1c calc(var(--h) * .45), #7a2a52 calc(var(--h) * .8), #e8559a calc(var(--h) * .94), #f5a9c9 var(--h), rgba(245,169,201,0) calc(var(--h) + 9%)); mix-blend-mode: multiply; }
  .glow { background: radial-gradient(ellipse 70% 22% at 50% var(--h), rgba(245,169,201,.55), rgba(232,85,154,.22) 55%, transparent 80%); mix-blend-mode: screen; }
  .shade { background: linear-gradient(0deg, rgba(10,6,9,.82) 0%, rgba(10,6,9,.35) 16%, rgba(10,6,9,0) 34%), radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(10,6,9,.4) 100%); }
  .logo { position: absolute; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 8px 30px rgba(10,6,9,.6)); line-height: 0; }
  .logo svg { width: 100%; height: auto; }
  .tag { position: absolute; left: 0; right: 0; text-align: center; color: var(--pd-cream); text-transform: uppercase; text-shadow: 0 2px 10px rgba(10,6,9,.9); }
  .tag b { display: block; font: 700 1em/1.1 var(--pd-cond); letter-spacing: .24em; }
  .tag span { display: block; margin-top: .45em; font: 600 .66em/1.1 var(--pd-cond); letter-spacing: .26em; opacity: .85; }
  .landscape .logo { top: 2%; width: 600px; }
  .landscape .tag { bottom: 34px; font-size: 27px; }
  .portrait .logo { top: 9%; width: 940px; }
  .portrait .tag { bottom: 120px; font-size: 38px; }
  .logo-only { display: flex; align-items: center; justify-content: center; } .logo-only .logo { position: static; transform: none; width: 80vw; max-width: 1000px; }
</style></head>
<body><div id="c"></div>
<script src="../../palermo-data.js"></script><script src="../../props-data.js"></script>  <!-- src/ui.js pulls in modules that read these at load -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }</script>
<script type="module">
import { logoSVG } from '../../src/ui.js';
const q = new URLSearchParams(location.search), mode = ['landscape', 'portrait', 'logo'].includes(q.get('mode')) ? q.get('mode') : 'landscape';   // the mode goes into HTML below: only these three
const c = document.getElementById('c');
if (mode === 'logo') { c.className = 'logo-only'; c.innerHTML = `<div class="logo">${logoSVG('x')}</div>`; }
else {
  c.className = mode;
  c.innerHTML = `<img class="bg" src="cover-src/bg-${mode}.jpg" alt="">
    <div class="layer dusk"></div><div class="layer glow"></div><div class="layer shade"></div>
    <div class="logo">${logoSVG('x')}</div>
    <div class="tag"><b>3 ruote 2 frecce 1 clacson 0 dignità</b></div>`;
}
document.fonts.ready.then(() => document.documentElement.dataset.ready = '1');
</script></body></html>
