<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#a9c4da;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildModels, makeMaterial } from './models.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.85; r.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#a9c4da');
scene.add(new THREE.HemisphereLight('#c9cfd4', '#9a8566', 1.2));
const sun = new THREE.DirectionalLight('#ffe4bd', 2.9); sun.position.set(-30, 30, 20); sun.castShadow = true; scene.add(sun);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#7e7c76' })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const M = buildModels(), mat = makeMaterial();
const cols = { panda: '#f0f0f0', punto: '#b9bcc2', smart: '#c8301f', taxi: '#ffffff', van: '#f2f2f0', bus: '#d4561f', vespa: '#2f6f9a', vespaB: '#d8d0b0', apePick: '#7fa3c0', apeCrate: '#e8e0c0', apeFood: '#efe3c8', carrozza: '#5a3a24', carretto: '#2e2a26' };
const names = (q.get('m') || Object.keys(M).join(',')).split(',');
const sp = +q.get('sp') || 7; let x = 0; const tris = {};
names.forEach((n, i) => {
  const im = new THREE.InstancedMesh(M[n], mat, 1); im.setColorAt(0, new THREE.Color(cols[n] || '#fff'));
  const px = (i % 7 - 3) * sp, pz = Math.floor(i / 7) * -sp * 1.4 + (q.has('far') ? 0 : 0);
  im.setMatrixAt(0, new THREE.Matrix4().makeRotationY(+q.get('rot') || 0).setPosition(px, 0, pz));
  im.castShadow = true; scene.add(im); tris[n] = M[n].attributes.position.count / 3 | 0;
});
console.log('TRIS ' + JSON.stringify(tris));
const [cx, cy, cz] = (q.get('cam') || '0,9,14').split(',').map(Number), [lx, ly, lz] = (q.get('look') || '0,1,0').split(',').map(Number);
const cam = new THREE.PerspectiveCamera(+q.get('fov') || 45, innerWidth / innerHeight, 0.1, 500); cam.position.set(cx, cy, cz); cam.lookAt(lx, ly, lz);
r.render(scene, cam);
</script>
