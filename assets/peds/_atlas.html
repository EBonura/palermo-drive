<!doctype html><body style="margin:0;background:#8a9a7a"><script type="module">
import { buildAtlas, VARIANTS } from './sprites.js';
const t=performance.now(); const cv = buildAtlas(); document.title='atlas '+(performance.now()-t).toFixed(0)+' ms '+VARIANTS.length;
const z=3, per=4, cw=24*z, ch=48*z, W=per*(4*cw+16), rows=Math.ceil(VARIANTS.length/per);
const out=document.createElement('canvas'); out.width=W; out.height=rows*(ch+16); const g=out.getContext('2d'); g.imageSmoothingEnabled=false;
g.font='11px monospace'; g.fillStyle='#111';
VARIANTS.forEach((v,i)=>{ const x0=(i%per)*(4*cw+16), y0=Math.floor(i/per)*(ch+16);
  for(let d=0;d<4;d++) g.drawImage(cv,(d*4)*24,i*48,24,48,x0+d*cw,y0+12,cw,ch);
  g.fillText(i+' '+v.id,x0+2,y0+10); });
document.body.appendChild(out);
</script>
