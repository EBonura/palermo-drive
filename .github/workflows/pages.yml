# Builds the minified bundle (tools/build) on every push to main and deploys dist/ to GitHub Pages.
# The development tree keeps working as is (python -m http.server + import map); only the published site is built.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# nothing is granted by default: each job asks for what it needs
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions are pinned to the commit their version tag pointed at (a tag can be moved, a commit cannot); bump them together with the tag in the comment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/build/package-lock.json
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tools/build
      # the build includes the peer to peer client and lets the policy reach its pinned Nostr relays (src/p2p/relays.js)
      - name: Build dist/
        run: node build.mjs
        working-directory: tools/build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # three tries of at most 10 minutes each (the most deploy-pages allows) plus the waits between them
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # Pages sometimes keeps a deployment queued on its side for minutes, then fails it ("Deployment failed, try again later")
      # or the action gives up at its 10 minute cap; the same artifact deploys fine a few minutes later, so try up to three times
      - id: deploy1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 120
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 300
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
