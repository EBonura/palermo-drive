# Builds the minified bundle (tools/build) on every push to main and deploys dist/ to GitHub Pages.
# The development tree keeps working as is (python -m http.server + import map); only the published site is built.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/build/package-lock.json
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tools/build
      - name: Build dist/
        run: node build.mjs
        working-directory: tools/build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
