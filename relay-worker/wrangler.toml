name = "pd-relay"
main = "build/index.js"
compatibility_date = "2026-06-01"

[build]
command = "worker-build --release"
watch_dir = "src"

# Comma separated browser origins allowed to open a socket. localhost and 127.0.0.1 on any port
# are always allowed on top of this, for development.
[vars]
ORIGINS = "https://palermo-drive.it"
# The same for tables (BLATERO). The itch.io game frame is served from this host, which every HTML5 game on itch shares.
TABLE_ORIGINS = "https://html-classic.itch.zone"

# One object holds the whole relay, see the README for why. Tables (BLATERO) are a second class with ONE instance of
# its own, so a fault or a flood on one game cannot take the other's object down.
[durable_objects]
bindings = [{ name = "RELAY", class_name = "Relay" }, { name = "TABLES", class_name = "Tables" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Tables"]
