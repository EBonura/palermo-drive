<!doctype html><meta charset="utf-8"><title>lmtest (temporary)</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="palermo-data.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { hooks } from './src/core.js';
const Q = new URLSearchParams(location.search);
const num = (k, d) => Q.has(k) ? +Q.get(k) : d;
const gy0 = num('gy', 10), sx = num('sx', 0), sz = num('sz', 0), ox = num('ox', 0), oz = num('oz', 0);
hooks.ground = (x, z) => gy0 + (x - ox) * sx + (z - oz) * sz;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1280, 720); document.body.appendChild(r.domElement);
r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.85;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#a9c4da'); scene.fog = new THREE.FogExp2('#a9c4da', 0.0007);
scene.add(new THREE.HemisphereLight('#cfe0f0', '#8a7f6a', 1.4));
const sun = new THREE.DirectionalLight('#fff1d8', 3.0); sun.position.set(-1, 0.55, -0.35).multiplyScalar(300).add(new THREE.Vector3(num('lx', 0), 0, num('lz', 0)));
sun.target.position.set(num('lx', 0), gy0, num('lz', 0)); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); const sc = sun.shadow.camera; sc.left = sc.bottom = -num('sh', 150); sc.right = sc.top = num('sh', 150); sc.near = 10; sc.far = 800; scene.add(sun);
const gm = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000, 40, 40), new THREE.MeshStandardMaterial({ color: Q.get('gc') || '#a9a291' }));
gm.rotation.x = -Math.PI / 2; gm.receiveShadow = true; { const p = gm.geometry.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i) + num('lx', 0), z = -p.getY(i) + num('lz', 0); p.setZ(i, hooks.ground(x, z) - 0.05); } } gm.position.set(num('lx', 0), 0, num('lz', 0)); gm.geometry.attributes.position.needsUpdate = true; gm.geometry.computeVertexNormals(); gm.position.y = 0;
// translate the plane so its vertices sit at world x,z (plane is centred on lx,lz); z was remapped above: fine
scene.add(gm);
const cam = new THREE.PerspectiveCamera(num('fov', 60), 1280 / 720, 0.5, 40000);
const cp = (Q.get('campos') || '0,30,60').split(',').map(Number), lk = (Q.get('look') || '0,10,0').split(',').map(Number);
cam.position.set(...cp); cam.lookAt(...lk);
const m = await import('./src/landmarks-city.js?' + Date.now());
const want = (Q.get('lm') || '').toLowerCase();
for (const l of m.CITY_LANDMARKS) {
  if (want && !l.name.toLowerCase().includes(want)) continue;
  try { const t0 = performance.now(); const o = l.build({}); scene.add(o); console.log('LM', l.name, 'tris', o.userData.tris, 'ms', Math.round(performance.now() - t0)); } catch (e) { console.error('LM FAIL', l.name, e.stack); }
}
r.render(scene, cam); requestAnimationFrame(() => { r.render(scene, cam); document.title = 'ready'; });
</script>
