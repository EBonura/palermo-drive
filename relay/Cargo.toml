[package]
name = "palermo-drive-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "MIT"

[[bin]]
name = "relay"
path = "src/main.rs"

[[bin]]
name = "loadtest"
path = "src/bin/loadtest.rs"
required-features = ["loadtest"]

[features]
# cargo build --release --features metrics: tick timing, allocation counts and bytes per player-minute (nothing is compiled in without it)
metrics = []
# cargo build --release --features loadtest --bin loadtest
loadtest = ["dep:tokio-tungstenite", "dep:futures-util", "tokio/rt-multi-thread"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "signal", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
bytes = "1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-general-category = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
